services:
  postgres:
    image: docker.io/library/postgres:${POSTGRES_IMAGE_TAG:-16}
    container_name: my-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume for actual DB cluster storage
      - pgdata:/var/lib/postgresql/data
      # Bind mount for CSV imports with SELinux shared label
      - ./imports:/imports:z

volumes:
  pgdata:
